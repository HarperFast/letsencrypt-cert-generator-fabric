name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON((github.event.inputs.node-version == '' || github.event.inputs.node-version == 'all') && '[22, 24, 26]' || format('[{0}]', github.event.inputs.node-version)) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check integration tests
        run: npm run typecheck

      - name: Run integration tests
        run: npm run test:integration
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-test-logs
          FORCE_COLOR: '1'

      - name: Upload Harper logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-logs-node-${{ matrix.node-version }}
          path: /tmp/harper-test-logs/
          retention-days: 7
