type ChallengeCertificate @table @sealed {
    domain: ID! @primaryKey
    issueDate: Date
    renewalDate: Date @indexed
    challengeToken: String @indexed
    challengeContent: String
    inProgress: Boolean
    failedAttempts: Int
    nextAttemptAt: Date
    lastError: String
}

type AcmeAccount @table @sealed {
    directoryUrl: ID! @primaryKey
    accountKey: String
}
